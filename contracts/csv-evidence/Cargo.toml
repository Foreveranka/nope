[package]
name = "csv-evidence"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
near-sdk = "=5.30.1"
[dev-dependencies]
near-sdk = { version = "=5.30.1", features = ["unit-testing"] }
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = "symbols"
